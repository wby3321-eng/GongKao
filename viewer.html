<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件预览</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--bg); }
  .viewer-wrap { display: flex; flex-direction: column; height: 100vh; }
  .viewer-top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .viewer-title { flex: 1; font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-iframe { flex: 1; border: 0; width: 100%; }
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .viewer-error {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="viewer-wrap">
  <div class="viewer-top">
    <a class="btn" href="index.html">← 返回目录</a>
    <div class="viewer-title" id="file-title">加载中...</div>
    <a class="btn btn-primary" id="download-btn" href="#" download>⬇ 下载</a>
  </div>
  <iframe id="viewer-frame" class="viewer-iframe" title="文档预览"></iframe>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const path = params.get('path');
  const name = params.get('name') || path || '未知文件';
  const titleEl = document.getElementById('file-title');
  const frame = document.getElementById('viewer-frame');
  const downloadBtn = document.getElementById('download-btn');

  titleEl.textContent = decodeURIComponent(name);

  if (!path) {
    titleEl.textContent = '未指定文件';
  } else {
    const url = encodeURI(path);
    downloadBtn.href = url;

    if (path.toLowerCase().endsWith('.pdf')) {
      // PDF → 直接用浏览器原生预览（跳转，不走 iframe）
      titleEl.textContent = '即将打开：' + decodeURIComponent(name);
      // 顶部保留"返回目录"按钮，中间显示提示
      document.querySelector('.viewer-wrap').innerHTML =
        '<div class="viewer-top">' +
        '  <a class="btn" href="index.html">← 返回目录</a>' +
        '  <div class="viewer-title">正在跳转 PDF 预览...</div>' +
        '  <a class="btn btn-primary" href="' + url + '" download>⬇ 下载</a>' +
        '</div>' +
        '<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--text-secondary);padding:40px;">' +
        '  <div style="font-size:48px;">📄</div>' +
        '  <div style="font-size:16px;">浏览器即将打开 PDF 预览</div>' +
        '  <a class="btn btn-primary" href="' + url + '">如果没有自动打开，点击这里 →</a>' +
        '</div>';
      // 延迟跳转，让用户看到顶部导航
      setTimeout(function() { window.location.href = url; }, 300);
    } else {
      // DOC/DOCX → Google Docs Viewer
      const baseUrl = location.origin + location.pathname.replace('viewer.html', '');
      frame.src = 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + path) + '&embedded=true';
    }
  }
</script>
</body>
</html>
