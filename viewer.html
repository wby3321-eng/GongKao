<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件预览</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  .viewer-wrap { display: flex; flex-direction: column; height: 100vh; }
  .viewer-top {
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .viewer-title { flex: 1; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 12px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--border); color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* PDF.js viewer 区域 */
  .pdf-container {
    flex: 1; overflow: auto; background: #1a1a1a;
    padding: 20px 0; display: flex; flex-direction: column; align-items: center;
  }
  .pdf-page {
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    margin-bottom: 16px; background: #fff;
  }
  .pdf-toolbar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 6px 20px; background: var(--surface-2);
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .pdf-toolbar .sep { width: 1px; height: 16px; background: var(--border); }
  .page-input {
    width: 48px; padding: 2px 4px; text-align: center;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; font-size: 12px;
  }
  .zoom-display { color: var(--text-muted); min-width: 40px; text-align: center; }

  /* 加载/错误 */
  .loading, .error {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; color: var(--text-secondary);
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--warning); font-size: 13px; }
</style>
</head>
<body>
<div class="viewer-wrap">
  <div class="viewer-top">
    <a class="btn" href="index.html">← 返回目录</a>
    <div class="viewer-title" id="file-title">加载中...</div>
    <a class="btn btn-primary" id="download-btn" href="#" download>⬇ 下载</a>
  </div>
  <div id="content-area" style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <div class="loading">
      <div class="spinner"></div>
      <div>正在加载文档...</div>
    </div>
  </div>
</div>

<!-- PDF.js via CDN (稳定版 3.4.120) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const path = params.get('path');
  const name = params.get('name') || path || '未知文件';
  const titleEl = document.getElementById('file-title');
  const contentArea = document.getElementById('content-area');
  const downloadBtn = document.getElementById('download-btn');
  const fileUrl = path ? encodeURI(path) : null;
  const isPdf = path && path.toLowerCase().endsWith('.pdf');

  titleEl.textContent = decodeURIComponent(name);
  if (fileUrl) downloadBtn.href = fileUrl;

  if (!path) {
    contentArea.innerHTML = '<div class="loading error">未指定文件</div>';
  } else if (isPdf) {
    renderPdf(fileUrl);
  } else {
    renderDoc(path);
  }

  // ===== PDF.js 渲染 =====
  function renderPdf(url) {
    // 先渲染 toolbar
    contentArea.innerHTML =
      '<div class="pdf-toolbar">' +
      '  <button class="btn" id="prev-page">◀</button>' +
      '  <span>第 <input class="page-input" id="page-num" type="text" value="1"> / <span id="total-pages">?</span> 页</span>' +
      '  <button class="btn" id="next-page">▶</button>' +
      '  <span class="sep"></span>' +
      '  <button class="btn" id="zoom-out">−</button>' +
      '  <span class="zoom-display" id="zoom-level">100%</span>' +
      '  <button class="btn" id="zoom-in">+</button>' +
      '  <button class="btn" id="zoom-fit">适合</button>' +
      '</div>' +
      '<div class="pdf-container" id="pdf-container"><div class="loading"><div class="spinner"></div><div>正在加载 PDF...</div></div></div>';

    const container = document.getElementById('pdf-container');
    let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
    let currentScale = 1.2, canvasEls = [];

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    pdfjsLib.getDocument({ url: url }).promise.then(pdf => {
      pdfDoc = pdf;
      document.getElementById('total-pages').textContent = pdf.numPages;
      document.getElementById('page-num').max = pdf.numPages;
      container.innerHTML = '';
      // 预创建所有页 canvas
      for (let i = 1; i <= pdf.numPages; i++) {
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.dataset.pageNum = i;
        canvas.width = Math.floor(800 * currentScale);
        container.appendChild(canvas);
        canvasEls.push(canvas);
      }
      // 渲染第一页
      renderPage(1);
      // 渲染其他页
      for (let i = 2; i <= pdf.numPages; i++) setTimeout(() => renderPage(i), 50);
      // 监听滚动，翻页
      bindScrollPager();
    }).catch(err => {
      console.error('PDF load error:', err);
      container.innerHTML =
        '<div class="loading error">' +
        '  <div style="font-size:48px;">⚠️</div>' +
        '  <div class="error-msg">PDF 加载失败</div>' +
        '  <a class="btn btn-primary" href="' + url + '" target="_blank">直接打开文件</a>' +
        '</div>';
    });

    function renderPage(num) {
      if (!pdfDoc) return;
      pageRendering = true;
      pdfDoc.getPage(num).then(page => {
        const canvas = canvasEls[num - 1];
        const ctx = canvas.getContext('2d');
        const viewport = page.getViewport({ scale: currentScale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
        renderTask.promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num; else renderPage(num);
    }

    function bindScrollPager() {
      container.addEventListener('scroll', () => {
        const scrollTop = container.scrollTop;
        let current = 1;
        for (let i = 0; i < canvasEls.length; i++) {
          if (canvasEls[i].offsetTop <= scrollTop + 100) current = i + 1;
        }
        if (current !== pageNum) {
          pageNum = current;
          document.getElementById('page-num').value = pageNum;
        }
      });
    }

    document.getElementById('prev-page').onclick = () => {
      if (pageNum <= 1) return;
      pageNum--;
      document.getElementById('page-num').value = pageNum;
      canvasEls[pageNum - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    document.getElementById('next-page').onclick = () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      document.getElementById('page-num').value = pageNum;
      canvasEls[pageNum - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    document.getElementById('page-num').addEventListener('change', () => {
      const n = parseInt(document.getElementById('page-num').value);
      if (n >= 1 && n <= pdfDoc.numPages) {
        pageNum = n;
        canvasEls[n - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('zoom-in').onclick = () => {
      currentScale = Math.min(currentScale + 0.2, 3);
      applyZoom();
    };
    document.getElementById('zoom-out').onclick = () => {
      currentScale = Math.max(currentScale - 0.2, 0.4);
      applyZoom();
    };
    document.getElementById('zoom-fit').onclick = () => {
      const w = container.clientWidth - 40;
      // 用当前页算比例
      if (pdfDoc) {
        pdfDoc.getPage(1).then(page => {
          const v = page.getViewport({ scale: 1 });
          currentScale = Math.min(w / v.width, 1.8);
          applyZoom();
        });
      }
    };

    function applyZoom() {
      document.getElementById('zoom-level').textContent = Math.round(currentScale * 100) + '%';
      container.innerHTML = '';
      canvasEls = [];
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.dataset.pageNum = i;
        container.appendChild(canvas);
        canvasEls.push(canvas);
      }
      pageNum = 1;
      document.getElementById('page-num').value = '1';
      renderPage(1);
      for (let i = 2; i <= pdfDoc.numPages; i++) setTimeout(() => renderPage(i), 30);
    }
  }

  // ===== DOC/DOCX → Google Docs Viewer =====
  function renderDoc(p) {
    const baseUrl = location.origin + location.pathname.replace('viewer.html', '');
    contentArea.innerHTML = '<iframe style="flex:1;border:0;width:100%;background:#fff;" src="about:blank"></iframe>';
    const iframe = contentArea.querySelector('iframe');
    iframe.src = 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + p) + '&embedded=true';
  }
</script>
</body>
</html>
