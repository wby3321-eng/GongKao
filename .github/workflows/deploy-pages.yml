name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate data.json
        run: python3 scripts/gen-data.py

      - name: Cache-bust assets
        run: |
          VER=$(cat assets/app.js assets/style.css | sha1sum | cut -c1-10)
          sed -i "s|assets/style.css\"|assets/style.css?v=$VER\"|; s|assets/app.js\"|assets/app.js?v=$VER\"|" index.html
          echo "asset version: $VER"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
