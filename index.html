<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务员考试资料库</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📚</span>
    <h1>公务员考试资料库</h1>
  </div>
  <div class="topbar-right">
    <span id="gen-time" class="gen-time"></span>
    <a class="github-link" href="https://github.com/wby3321-eng/GongKao" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
    </a>
  </div>
</header>

<!-- 省份切换 -->
<nav id="province-nav" class="province-nav"></nav>

<!-- 分类切换 -->
<nav id="category-nav" class="category-nav"></nav>

<!-- 分组切换 -->
<nav id="group-nav" class="group-nav"></nav>

<!-- 年份筛选 -->
<div class="filter-bar">
  <span class="filter-label">年份筛选</span>
  <div id="year-filter" class="year-filter">
    <button class="year-chip active" data-year="_all">全部</button>
  </div>
</div>

<!-- 文件列表 -->
<main class="main-content">
  <div id="file-grid" class="file-grid">
    <div class="loading">加载中...</div>
  </div>
</main>

<footer class="footer">
  <span>📘 共 <b id="total-count">0</b> 份资料</span>
  <span class="sep">·</span>
  <span>数据自动扫描生成</span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
